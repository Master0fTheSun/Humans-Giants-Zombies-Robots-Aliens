<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Command Center — Income OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <span class="logo-icon">◈</span>
        <span class="logo-text">Income OS</span>
      </div>
      <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section">
        <span class="nav-label">Overview</span>
        <a class="nav-item active" data-page="overview" href="#">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><rect x="2" y="2" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="11" y="2" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="2" y="11" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="11" y="11" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/></svg>
          <span>Dashboard</span>
        </a>
        <a class="nav-item" data-page="analytics" href="#">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><path d="M3 15l4-5 3 3 3-4 4 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Analytics</span>
        </a>
      </div>

      <div class="nav-section">
        <span class="nav-label">Income Streams</span>
        <a class="nav-item" data-page="trading" href="#">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><path d="M3 13l4-4 3 3 3-5 4 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 7h2v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Trading</span>
          <span class="nav-badge" style="background:rgba(59,130,246,0.15);color:var(--blue)">Futures</span>
        </a>
        <a class="nav-item" data-page="writing" href="#">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><path d="M4 14l2-2 8-8 2 2-8 8-2 2H4v-2z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Writing / B2B</span>
          <span class="nav-badge writing">Active</span>
        </a>
        <a class="nav-item" data-page="insurance" href="#">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><path d="M10 2l6 3v5c0 4-3 7-6 8C7 17 4 14 4 10V5l6-3z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          <span>Insurance</span>
          <span class="nav-badge insurance">Commissions</span>
        </a>
        <a class="nav-item" data-page="lyft" href="#">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.5"/><path d="M7 10l2 2 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Lyft</span>
          <span class="nav-badge lyft">Gig</span>
        </a>
      </div>

      <div class="nav-section">
        <span class="nav-label">Finance</span>
        <a class="nav-item" data-page="taxes" href="#">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><path d="M5 3h10a1 1 0 011 1v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4a1 1 0 011-1z" stroke="currentColor" stroke-width="1.5"/><path d="M7 8h6M7 11h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span>Taxes & Expenses</span>
        </a>
        <a class="nav-item" data-page="clients" href="#">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7" r="3" stroke="currentColor" stroke-width="1.5"/><path d="M4 17c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span>Clients</span>
        </a>
      </div>

      <div class="nav-section">
        <span class="nav-label">System</span>
        <a class="nav-item" data-page="settings" href="#">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.22 4.22l1.42 1.42M14.36 14.36l1.42 1.42M4.22 15.78l1.42-1.42M14.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span>Settings</span>
        </a>
      </div>
    </nav>

    <div class="sidebar-footer">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="icon-sun" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="4" stroke="currentColor" stroke-width="1.5"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.22 4.22l1.42 1.42M14.36 14.36l1.42 1.42M4.22 15.78l1.42-1.42M14.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <svg class="icon-moon" viewBox="0 0 20 20" fill="none"><path d="M17.5 12A7.5 7.5 0 018 2.5a7.5 7.5 0 100 15 7.5 7.5 0 009.5-5.5z" stroke="currentColor" stroke-width="1.5"/></svg>
        <span class="theme-label">Dark Mode</span>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content" id="mainContent">
    <!-- Top Bar -->
    <header class="topbar">
      <div class="topbar-left">
        <button class="mobile-menu-btn" id="mobileMenuBtn">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <div class="breadcrumb">
          <span class="breadcrumb-home">Income OS</span>
          <span class="breadcrumb-sep">/</span>
          <span class="breadcrumb-current" id="breadcrumbCurrent">Dashboard</span>
        </div>
      </div>
      <div class="topbar-right">
        <div class="date-display" id="dateDisplay"></div>
        <button class="add-entry-btn" id="addEntryBtn">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Add Entry
        </button>
      </div>
    </header>

    <!-- Page Content Panels -->
    <div class="page-content">
      <div class="page-panel active" id="page-overview"></div>
      <div class="page-panel" id="page-analytics"></div>
      <div class="page-panel" id="page-trading"></div>
      <div class="page-panel" id="page-writing"></div>
      <div class="page-panel" id="page-insurance"></div>
      <div class="page-panel" id="page-lyft"></div>
      <div class="page-panel" id="page-taxes"></div>
      <div class="page-panel" id="page-clients"></div>
      <div class="page-panel" id="page-settings"></div>
    </div>
  </main>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">Add Entry</h3>
        <button class="modal-close" id="modalClose">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- Toast Notifications -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="js/modules/data.js"></script>
  <script src="js/modules/charts.js"></script>
  <script src="js/modules/overview.js"></script>
  <script src="js/modules/writing.js"></script>
  <script src="js/modules/insurance.js"></script>
  <script src="js/modules/lyft.js"></script>
  <script src="js/modules/taxes.js"></script>
  <script src="js/modules/clients.js"></script>
  <script src="js/modules/trading.js"></script>
  <script src="js/modules/analytics.js"></script>
  <script src="js/modules/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

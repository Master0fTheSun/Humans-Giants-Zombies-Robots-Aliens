<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IncomOS — Business Command Center</title>
  <link rel="stylesheet" href="css/styles.css">
  <!-- Chart.js -->
